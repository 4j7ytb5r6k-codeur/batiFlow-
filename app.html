<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon espace – batiFlow</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="dash" hidden>
  <aside class="d-side">
    <a href="index.html" class="d-brand">bati<b>Flow</b></a>
    <nav aria-label="Menu de l'espace client" id="sideNav">
      <button type="button" data-view="dashboard" class="is-active">Tableau de bord</button>
      <button type="button" data-view="chantiers">Chantiers</button>
      <button type="button" data-view="devis">Devis</button>
      <button type="button" data-view="crs">Comptes rendus</button>
      <button type="button" data-view="clients">Clients</button>
      <button type="button" data-view="account">Mon compte</button>
      <a href="admin.html" id="adminLink" hidden>Administration</a>
    </nav>
    <div class="d-help"><strong>Besoin d'aide ?</strong><span>Une question sur batiFlow ?</span><a class="btn btn--ghost btn--sm" id="helpLink" href="index.html#contact">Nous contacter</a></div>
  </aside>

  <div class="d-main">
    <header class="d-top">
      <span class="d-trial" id="trial">Essai gratuit</span>
      <div class="d-user"><span class="d-avatar" id="avatar">?</span><span><strong id="uname">Votre compte</strong><small id="ucompany"></small></span>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">Déconnexion</button></div>
    </header>
    <div id="banner"></div>
    <main class="d-content" id="view" aria-live="polite"></main>
  </div>

  <dialog id="dlg" class="d-dialog"><form method="dialog" id="dlgForm" novalidate></form></dialog>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
